# Homebrew packages and dotfiles for macOS. mise loads this file only on
# macOS (see miserc.toml) and installs packages into the normal Homebrew
# prefix, so `brew upgrade` and topgrade keep working. Add or remove packages
# with `mise brew install <formula>` or `mise brew uninstall <formula>` (the
# tasks at the end).

[bootstrap.brew]
# Keep apps that were installed by hand instead of replacing them.
adopt = true

[bootstrap.packages]
# Bootstrap and shells
"brew:bash" = "latest"
"brew:carapace" = "latest"
"brew:mise" = "latest"
"brew:nushell" = "latest"
"brew:topgrade" = "latest"
"brew:zsh-autocomplete" = "latest"

# Developer tools not managed by mise
"brew:cmake" = "latest"
"brew:goose" = "latest"
"brew:gzip" = "latest"
"brew:llama.cpp" = "latest"
"brew:poppler" = "latest"
"brew:tcl-tk" = "latest"

# macOS utilities
"brew:mactop" = "latest"
"brew:tw93/tap/mole" = "latest"
"brew-cask:1password" = "latest"
"brew-cask:boop" = "latest"
"brew-cask:dbeaver-community" = "latest"
"brew-cask:dockdoor" = "latest"
"brew-cask:macpacker" = "latest"
"brew-cask:orbstack" = "latest"

[dotfiles]
"~/.profile" = "~/.dotfiles/macos/profile"
"~/.zprofile" = "~/.dotfiles/macos/zprofile"
"~/.zshenv" = "~/.dotfiles/macos/zshenv"
"~/.zshrc" = "~/.dotfiles/macos/zshrc"
"~/.ssh/config" = { source = "~/.dotfiles/macos/ssh_config", mode = "copy", permissions = "0600" }
# Link each file so the modules that env.nu generates stay out of the repo.
"~/Library/Application Support/nushell" = { source = "~/.dotfiles/macos/nushell", mode = "symlink-each" }

# `mise brew install jq`, `mise brew uninstall --cask zed`, and so on: see
# packages.sh. Each change is recorded in this file.

[tasks.brew]
description = "Install or uninstall Homebrew formulae and record the change in config.macos.toml"
run = "sh ~/.dotfiles/mise/packages.sh brew"

[tasks.cask]
description = "Install or uninstall Homebrew casks and record the change in config.macos.toml"
run = "sh ~/.dotfiles/mise/packages.sh cask"
