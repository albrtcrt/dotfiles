# Tools and dotfiles for every machine. ~/.config/mise/config.toml links to this
# file, so `mise use -g <tool>` records the tool here.
min_version = "2026.10.0"

[tools]
ripgrep = "latest"
go = "latest"
golangci-lint = "latest"
node = "lts"
pnpm = "latest"
python = "latest"
uv = "latest"
lazygit = "latest"
typst = "latest"
"go:golang.org/x/tools/gopls" = "latest"
"pipx:git-filter-repo" = "latest"
"pipx:pipenv" = "latest"
usage = "latest"
git-lfs = "latest"
zellij = "latest"
"npm:@openai/codex" = "latest"
claude = "latest"

# Linked files edit the repository directly. Git and SSH settings are copied
# instead, because other programs add credentials and private hosts to them.
[dotfiles]
"~/.config/mise/config.toml" = "~/.dotfiles/mise/config.toml"
"~/.config/mise/config.macos.toml" = "~/.dotfiles/mise/config.macos.toml"
"~/.config/mise/config.linux.toml" = "~/.dotfiles/mise/config.linux.toml"
"~/.config/mise/miserc.toml" = "~/.dotfiles/mise/miserc.toml"
"~/.vimrc" = "~/.dotfiles/common/vimrc"
"~/.gitconfig" = { source = "~/.dotfiles/common/gitconfig", mode = "copy" }
"~/.local" = { permissions = "0700" }
"~/.ssh" = { permissions = "0700" }
